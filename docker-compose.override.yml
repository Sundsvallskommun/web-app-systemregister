version: '3'
services:
  backend:
    environment:
      # Required
      BASE_URL_PREFIX: ${BASE_URL_PREFIX:?err}
      API_BASE_URL: ${API_BASE_URL:?err}
      MUNICIPALITY_ID: ${MUNICIPALITY_ID:?err}
      JWT_SECRET: ${JWT_SECRET:?err}
      ORIGIN: ${ORIGIN:?err}
      # Optionals
      NODE_ENV: ${NODE_ENV-production}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL-3600}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL-604800}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED-false}
      LOG_FORMAT: ${LOG_FORMAT-dev}
      CREDENTIALS: ${CREDENTIALS-true}
  frontend:
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?err}
