version: '3'

# Lägger till api-service-systemregister + MariaDB.
# Kör med:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.api-service.yml up --build
#
# api-service och mariadb pratar internt via det privata sysreg-nätverket
# (mariadb är INTE publicerad på host-port som default — säker default).
# BFF i monorepo'n når api-service via host.docker.internal:${API_SERVICE_PORT}.

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME}-mariadb-${NODE_ENV}
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?err}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-systemregister}
      MARIADB_USER: ${MARIADB_USER:-systemreg}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?err}
    # Avkommentera om du vill nå MariaDB från host (t.ex. DBeaver):
    # ports:
    #   - "${MARIADB_PORT-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - sysreg

  api-service:
    build:
      context: ../api-service-systemregister
    container_name: ${COMPOSE_PROJECT_NAME}-api-service-${NODE_ENV}
    ports:
      - "${API_SERVICE_PORT-8080}:8080"
    environment:
      CONFIG_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-systemregister}
      CONFIG_DATASOURCE_USERNAME: ${MARIADB_USER:-systemreg}
      CONFIG_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD:?err}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # Override Flyway placeholders / övriga inställningar vid behov
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - sysreg

volumes:
  mariadb-data:

networks:
  sysreg:
    driver: bridge
